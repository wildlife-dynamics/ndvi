[workspace]
name = "ndvi"
channels = ['https://repo.prefix.dev/ecoscope-workflows/', 'conda-forge']
platforms = ['linux-64', 'osx-arm64', 'win-64']

[tool.wt]
# When true, PRs to `main` must come from `staging` or `patch-*` (enforced by
# .github/workflows/guard-main-prs.yml).
published = true

[dependencies]
# required for compilation
wt-compiler = "==0.10.1"
graphviz = "*"
# pinned: ruff 0.17.x conda package breaks `python -m ruff`, which wt-compiler uses to format generated code
ruff = "<0.17"
python = "3.14.*"

# required for testing
go-yq = "*"
